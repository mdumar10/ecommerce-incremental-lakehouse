
resources:
  jobs:
    ecommerce_pipeline:
      name: ecommerce-incremental-lakehouse

      tasks:
        - task_key: bronze
          notebook_task:
            notebook_path: ../notebooks/jobs/bronze.py

        - task_key: silver
          depends_on:
            - task_key: bronze
          notebook_task:
            notebook_path: ../notebooks/jobs/silver.py

        - task_key: gold
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: ../notebooks/jobs/gold.py
